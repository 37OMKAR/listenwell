<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.5" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c26"/>
      <stop offset="1" stop-color="#1c2431"/>
    </linearGradient>
    <linearGradient id="meterFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.7" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5a5f"/>
    </linearGradient>
  </defs>

  <rect width="440" height="900" fill="url(#bg)"/>

  <!-- Tab bar -->
  <g transform="translate(16,20)">
    <rect width="408" height="56" rx="14" fill="#131922" stroke="#232c3a"/>
    <rect x="4" y="4" width="132" height="48" rx="10" fill="url(#brand)"/>
    <text x="70" y="34" text-anchor="middle" fill="#fff" font-weight="600" font-size="15">Listen</text>
    <text x="204" y="34" text-anchor="middle" fill="#8a94a5" font-size="15">Hearing test</text>
    <text x="338" y="34" text-anchor="middle" fill="#8a94a5" font-size="15">About</text>
  </g>

  <!-- Hero -->
  <g transform="translate(16,92)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#brand)"/>
    <text x="26" y="35" text-anchor="middle" font-size="26">🎧</text>
    <text x="66" y="26" fill="#eaf0f7" font-size="22" font-weight="700">ClearHear</text>
    <text x="66" y="46" fill="#8a94a5" font-size="13">On-device speech clarity</text>
    <g transform="translate(320,20)">
      <circle cx="0" cy="0" r="6" fill="#4ade80"/>
      <rect x="14" y="-11" width="60" height="22" rx="11" fill="#131922" stroke="#232c3a"/>
      <text x="44" y="4" text-anchor="middle" fill="#8a94a5" font-size="12">42 ms</text>
    </g>
  </g>

  <!-- Big start button card -->
  <g transform="translate(16,168)">
    <rect width="408" height="260" rx="18" fill="url(#panel)" stroke="#232c3a"/>
    <rect x="18" y="18" width="372" height="72" rx="14" fill="url(#brand)"/>
    <text x="204" y="63" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">■ Stop</text>

    <!-- Spectrum -->
    <g transform="translate(20,108)">
      <rect width="368" height="72" rx="10" fill="#0a0d13" stroke="#232c3a"/>
      <g fill="url(#brand)">
        <rect x="8"   y="46" width="6" height="18" rx="1"/>
        <rect x="16"  y="30" width="6" height="34" rx="1"/>
        <rect x="24"  y="14" width="6" height="50" rx="1"/>
        <rect x="32"  y="24" width="6" height="40" rx="1"/>
        <rect x="40"  y="6"  width="6" height="58" rx="1"/>
        <rect x="48"  y="22" width="6" height="42" rx="1"/>
        <rect x="56"  y="12" width="6" height="52" rx="1"/>
        <rect x="64"  y="34" width="6" height="30" rx="1"/>
        <rect x="72"  y="20" width="6" height="44" rx="1"/>
        <rect x="80"  y="8"  width="6" height="56" rx="1"/>
        <rect x="88"  y="16" width="6" height="48" rx="1"/>
        <rect x="96"  y="28" width="6" height="36" rx="1"/>
        <rect x="104" y="44" width="6" height="20" rx="1"/>
        <rect x="112" y="30" width="6" height="34" rx="1"/>
        <rect x="120" y="18" width="6" height="46" rx="1"/>
        <rect x="128" y="10" width="6" height="54" rx="1"/>
        <rect x="136" y="26" width="6" height="38" rx="1"/>
        <rect x="144" y="38" width="6" height="26" rx="1"/>
        <rect x="152" y="24" width="6" height="40" rx="1"/>
        <rect x="160" y="12" width="6" height="52" rx="1"/>
        <rect x="168" y="6"  width="6" height="58" rx="1"/>
        <rect x="176" y="20" width="6" height="44" rx="1"/>
        <rect x="184" y="32" width="6" height="32" rx="1"/>
        <rect x="192" y="46" width="6" height="18" rx="1"/>
        <rect x="200" y="30" width="6" height="34" rx="1"/>
        <rect x="208" y="18" width="6" height="46" rx="1"/>
        <rect x="216" y="26" width="6" height="38" rx="1"/>
        <rect x="224" y="40" width="6" height="24" rx="1"/>
        <rect x="232" y="28" width="6" height="36" rx="1"/>
        <rect x="240" y="14" width="6" height="50" rx="1"/>
        <rect x="248" y="24" width="6" height="40" rx="1"/>
        <rect x="256" y="36" width="6" height="28" rx="1"/>
        <rect x="264" y="48" width="6" height="16" rx="1"/>
        <rect x="272" y="34" width="6" height="30" rx="1"/>
        <rect x="280" y="42" width="6" height="22" rx="1"/>
        <rect x="288" y="50" width="6" height="14" rx="1"/>
        <rect x="296" y="46" width="6" height="18" rx="1"/>
        <rect x="304" y="52" width="6" height="12" rx="1"/>
        <rect x="312" y="48" width="6" height="16" rx="1"/>
        <rect x="320" y="50" width="6" height="14" rx="1"/>
        <rect x="328" y="52" width="6" height="12" rx="1"/>
        <rect x="336" y="54" width="6" height="10" rx="1"/>
        <rect x="344" y="52" width="6" height="12" rx="1"/>
        <rect x="352" y="54" width="6" height="10" rx="1"/>
      </g>
    </g>

    <!-- Meters -->
    <g transform="translate(20,196)" font-size="12" fill="#8a94a5">
      <text y="0">Mic in</text>
      <rect x="80" y="-9" width="220" height="10" rx="5" fill="#0a0d13" stroke="#232c3a"/>
      <rect x="80" y="-9" width="160" height="10" rx="5" fill="url(#meterFill)"/>
      <text x="308" y="0" fill="#eaf0f7">−12 dB</text>
    </g>
    <g transform="translate(20,224)" font-size="12" fill="#8a94a5">
      <text y="0">Headphones</text>
      <rect x="80" y="-9" width="220" height="10" rx="5" fill="#0a0d13" stroke="#232c3a"/>
      <rect x="80" y="-9" width="180" height="10" rx="5" fill="url(#meterFill)"/>
      <text x="308" y="0" fill="#eaf0f7">−8 dB</text>
    </g>
  </g>

  <!-- Preset card -->
  <g transform="translate(16,448)">
    <rect width="408" height="128" rx="18" fill="url(#panel)" stroke="#232c3a"/>
    <text x="18" y="30" font-size="11" fill="#8a94a5" letter-spacing="1.5">PRESET</text>
    <g transform="translate(18,46)" font-size="13" fill="#eaf0f7">
      <g><rect width="118" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="59" y="22" text-anchor="middle">💬 Conversation</text></g>
      <g transform="translate(128,0)"><rect width="112" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="56" y="22" text-anchor="middle">🏙 Noisy place</text></g>
      <g transform="translate(250,0)"><rect width="120" height="34" rx="17" fill="url(#brand)"/><text x="60" y="22" text-anchor="middle" fill="#fff">📺 TV / Lecture</text></g>
      <g transform="translate(0,46)"><rect width="102" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="51" y="22" text-anchor="middle">🌙 Quiet room</text></g>
      <g transform="translate(112,46)"><rect width="118" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="59" y="22" text-anchor="middle">🎵 Music / Voice</text></g>
    </g>
  </g>

  <!-- AI model card -->
  <g transform="translate(16,596)">
    <rect width="408" height="120" rx="18" fill="url(#panel)" stroke="#232c3a"/>
    <text x="18" y="30" font-size="11" fill="#8a94a5" letter-spacing="1.5">AI NOISE MODEL</text>
    <g transform="translate(18,46)" font-size="14" fill="#eaf0f7">
      <g><rect width="60"  height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="30" y="22" text-anchor="middle">Off</text></g>
      <g transform="translate(70,0)"><rect width="70" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="35" y="22" text-anchor="middle">Gate</text></g>
      <g transform="translate(150,0)"><rect width="130" height="34" rx="17" fill="#131922" stroke="#232c3a"/><text x="65" y="22" text-anchor="middle">Light (Speex)</text></g>
      <g transform="translate(0,46)"><rect width="190" height="34" rx="17" fill="url(#brand)"/><text x="95" y="22" text-anchor="middle" fill="#fff">Balanced (RNNoise)</text></g>
    </g>
  </g>

  <!-- Sliders card -->
  <g transform="translate(16,736)">
    <rect width="408" height="148" rx="18" fill="url(#panel)" stroke="#232c3a"/>
    <text x="18" y="30" font-size="11" fill="#8a94a5" letter-spacing="1.5">MAIN CONTROLS</text>

    <g transform="translate(18,52)" font-size="12" fill="#8a94a5">
      <text>🔊 Volume boost</text>
      <text x="372" text-anchor="end" fill="#eaf0f7">10 dB</text>
      <rect y="10" width="372" height="6" rx="3" fill="#131922" stroke="#232c3a"/>
      <rect y="10" width="220" height="6" rx="3" fill="url(#brand)"/>
      <circle cx="220" cy="13" r="10" fill="url(#brand)" stroke="#0b0f14" stroke-width="2"/>
    </g>
    <g transform="translate(18,92)" font-size="12" fill="#8a94a5">
      <text>🤖 AI mix (wet)</text>
      <text x="372" text-anchor="end" fill="#eaf0f7">0.80</text>
      <rect y="10" width="372" height="6" rx="3" fill="#131922" stroke="#232c3a"/>
      <rect y="10" width="298" height="6" rx="3" fill="url(#brand)"/>
      <circle cx="298" cy="13" r="10" fill="url(#brand)" stroke="#0b0f14" stroke-width="2"/>
    </g>
  </g>
</svg>
