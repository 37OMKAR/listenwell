<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fb3ff"/>
    </marker>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>

  <g font-size="13" fill="#eaf0f7" text-anchor="middle">
    <!-- Stages -->
    <g transform="translate(40,110)">
      <rect width="120" height="60" rx="14" fill="#161c26" stroke="#232c3a"/>
      <text x="60" y="28">🎙</text>
      <text x="60" y="48">Phone mic</text>
    </g>
    <g transform="translate(190,110)">
      <rect width="130" height="60" rx="14" fill="#161c26" stroke="#232c3a"/>
      <text x="65" y="28">Mic sensitivity</text>
      <text x="65" y="48" fill="#8a94a5" font-size="11">0 → +12 dB</text>
    </g>
    <g transform="translate(350,110)">
      <rect width="150" height="60" rx="14" fill="url(#brand)"/>
      <text x="75" y="28" fill="#fff" font-weight="600">AI noise model</text>
      <text x="75" y="48" fill="#fff" font-size="11">Off · Gate · Speex · RNNoise</text>
    </g>
    <g transform="translate(530,110)">
      <rect width="150" height="60" rx="14" fill="#161c26" stroke="#232c3a"/>
      <text x="75" y="28">Wet / dry mix</text>
      <text x="75" y="48" fill="#8a94a5" font-size="11">Delay-compensated dry</text>
    </g>
    <g transform="translate(710,110)">
      <rect width="170" height="60" rx="14" fill="url(#brand)"/>
      <text x="85" y="28" fill="#fff" font-weight="600">Clarity chain</text>
      <text x="85" y="48" fill="#fff" font-size="11">EQ · De-ess · Comp · Profile</text>
    </g>
    <g transform="translate(910,110)">
      <rect width="130" height="60" rx="14" fill="#161c26" stroke="#232c3a"/>
      <text x="65" y="28">Volume + limiter</text>
      <text x="65" y="48" fill="#8a94a5" font-size="11">Ceiling −3 dBFS</text>
    </g>
    <g transform="translate(1070,110)">
      <rect width="110" height="60" rx="14" fill="#161c26" stroke="#232c3a"/>
      <text x="55" y="28">🎧</text>
      <text x="55" y="48">Headphones</text>
    </g>

    <!-- Arrows -->
    <g stroke="#4fb3ff" stroke-width="2" fill="none" marker-end="url(#arr)">
      <path d="M160 140 L188 140"/>
      <path d="M320 140 L348 140"/>
      <path d="M500 140 L528 140"/>
      <path d="M680 140 L708 140"/>
      <path d="M880 140 L908 140"/>
      <path d="M1040 140 L1068 140"/>
    </g>

    <!-- Header -->
    <text x="600" y="42" font-size="20" font-weight="700" fill="#eaf0f7">Real-time signal chain — one AudioWorklet thread</text>
    <text x="600" y="68" font-size="13" fill="#8a94a5">128-sample blocks · 48 kHz · everything runs on-device</text>

    <!-- Footer -->
    <text x="600" y="230" font-size="12" fill="#8a94a5">Mic input has echoCancellation / noiseSuppression / autoGainControl OFF so our models get the raw signal.</text>
    <text x="600" y="250" font-size="12" fill="#8a94a5">Meters + spectrum analyser tap off the limiter output and stream to the UI at ~60 fps.</text>
  </g>
</svg>
